<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emotion Tracker – Dashboard</title>
  <style>
    :root { --bg:#edf6ef; --card:#ffffff; --text:#0b1f14; --muted:#5a6b5f; --border:#cfe2d5; --primary:#14532d; --primary-ink:#ffffff; --accent:#1a7f46; --ring:#9ae6b4; }
    body{ margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:linear-gradient(160deg, #f0f7f2, #e7f2ea); color:var(--text); }
    .container{ max-width:1100px; margin:0 auto; padding:24px; }
    
    .nav{ position:sticky; top:0; z-index:10; backdrop-filter: blur(6px); background:rgba(255,255,255,0.6); border-bottom:1px solid var(--border); }
    .nav-inner{ max-width:1100px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    .brand{ font-weight:700; color:var(--primary); letter-spacing:0.2px; }
    .nav-link{ padding:8px 12px; border-radius:10px; text-decoration:none; color:var(--text); font-weight:600; }
    .nav-link:hover{ background:#e6f3ea; }
    .nav-link.active{ background:var(--primary); color:var(--primary-ink); }
    
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow: 0 6px 20px rgba(20,83,45,0.06); }
    h1{ font-size:24px; margin:0 0 6px; }
    .muted{ color:var(--muted); }
    .grid{ display:grid; gap:12px; }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    
    .details{ margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; }
    .note{ background:#f4fbf6; border:1px solid var(--border); border-radius:10px; padding:10px; }
    .note h4{ margin:0 0 6px; font-size:13px; color:#0f2917; }
    .note-list{ display:grid; gap:6px; grid-template-columns: 1fr 1fr; }
    .badge{ background:#e6f3ea; color:#0b3d24; border:1px solid var(--border); border-radius:999px; padding:4px 8px; font-size:12px; }

    .pill{ border:1px solid var(--border); padding:6px 10px; border-radius:999px; }
    .item{ display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:12px; padding:12px; }
    .btn{ background:var(--primary); color:var(--primary-ink); padding:10px 14px; border:none; border-radius:12px; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,0.06);} .btn:hover{ filter:brightness(1.05);} .btn:active{ transform: translateY(1px);}
    select{ padding:8px 10px; border-radius:10px; border:1px solid var(--border); }
  </style>
</head>
<body>

  <div class="nav">
    <div class="nav-inner">
      <div class="brand">🌿 Pulse</div>
      <div class="links">
        <a href="index.html" class="nav-link ">Check‑in</a>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="margin-bottom:16px">
      <h1 style="display:flex; align-items:center; justify-content:space-between;">Leaderboard <span style="display:flex; gap:8px;"><button class="btn" id="exportBtn" title="Download CSV">⬇️ Export CSV</button></span></h1>
      <div class="row">
        <div>
          <label class="muted" style="font-size:12px; display:block;">City</label>
          <select id="cityFilter"></select>
        </div>
        <div>
          <label class="muted" style="font-size:12px; display:block;">Team</label>
          <select id="teamFilter" disabled></select>
        </div>
        <div>
          <label class="muted" style="font-size:12px; display:block;">Time window</label>
          <select id="timeFilter">
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90" selected>Last 90 days</option>
            <option value="all">All time</option>
          </select>
        </div>
        <div class="muted" id="meta"></div>
      </div>
    </div>

    <div class="card">
      <div id="list" class="grid"></div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

  <script>
    // ======= Configure me (same as index.html) =======
    const firebaseConfig = {
  apiKey: "AIzaSyBog7q44JN9wVjfk2wy7FqS80NLJC5348g",
  authDomain: "emotion-tracker-7f11c.firebaseapp.com",
  databaseURL: "https://emotion-tracker-7f11c-default-rtdb.firebaseio.com",
  projectId: "emotion-tracker-7f11c",
  storageBucket: "emotion-tracker-7f11c.firebasestorage.app",
  messagingSenderId: "232586277659",
  appId: "1:232586277659:web:1fcff097243c8fa1ef99be"
};
    // ================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let directory = null;
    let allEntries = [];

    // Anonymous sign in to read entries if rules require auth
    auth.onAuthStateChanged(()=>{}); auth.signInAnonymously().catch(e=>console.warn('Auth not required for read if rules allow:', e && e.code));

    // Load directory for filters
    fetch('directory.json').then(r => r.json()).then(data => {
      directory = data.cities || {};
      initFilters();
      attach();
    });

    function initFilters(){
      const citySel = document.getElementById('cityFilter');
      const teamSel = document.getElementById('teamFilter');
      citySel.innerHTML = '<option value="">All cities</option>' +
        Object.keys(directory).map(c => `<option value="${c}">${c}</option>`).join('');
      citySel.addEventListener('change', () => {
        const teams = directory[citySel.value]?.teams || {};
        teamSel.disabled = !citySel.value;
        teamSel.innerHTML = '<option value="">All teams</option>' +
          Object.entries(teams).map(([id,t]) => `<option value="${id}">${t.name || ('Team ' + id)}</option>`).join('');
        render();
      });
      teamSel.addEventListener('change', render);
      document.getElementById('timeFilter').addEventListener('change', render);
    }

    function attach(){
      db.ref('entries').on('value', snap => {
        const val = snap.val() || {};
        allEntries = Object.values(val);
        render();
      });
    }

    function withinWindow(ts, days){
      if (days === 'all') return true;
      const now = Date.now();
      const start = now - Number(days) * 24*60*60*1000;
      return ts >= start;
    }

    function render(){
      // Prepare list of filtered entries for both aggregation and details/export

      const city = document.getElementById('cityFilter').value;
      const team = document.getElementById('teamFilter').value;
      const windowDays = document.getElementById('timeFilter').value;
      const list = document.getElementById('list');
      const meta = document.getElementById('meta');

      const filtered = allEntries.filter(e =>
        (!city || e.city === city) &&
        (!team || e.team === team) &&
        withinWindow(e.createdAt || 0, windowDays)
      );

      // Aggregate: city -> team -> teammate -> emotion counts
      const agg = {};
      for (const e of filtered){
        const key = `${e.city}|${e.team}|${e.teammate}`;
        if (!agg[key]) agg[key] = { city:e.city, team:e.team, teammate:e.teammate, emotions:{} };
        agg[key].emotions[e.emotion] = (agg[key].emotions[e.emotion] || 0) + 1;
      }
      const rows = Object.values(agg).sort((a,b)=>{
        const asum = Object.values(a.emotions).reduce((p,c)=>p+c,0);
        const bsum = Object.values(b.emotions).reduce((p,c)=>p+c,0);
        return bsum - asum;
      });

      meta.textContent = `${filtered.length} check-ins`; // fixedgth} check-ins`;

      // map teammate key to their recent entries
      const byKey = {};
      for (const e of filtered){
        const key = `${e.city}|${e.team}|${e.teammate}`;
        (byKey[key] ||= []).push(e);
      }
      list.innerHTML = rows.map(row => {
        const pills = Object.entries(row.emotions)
          .sort((a,b)=>b[1]-a[1])
          .map(([emo,count]) => `<span class="pill">${emo} ${count}</span>`).join(' ');
        const notes = (byKey[`${row.city}|${row.team}|${row.teammate}`] || []).sort((a,b)=>b.createdAt-a.createdAt).slice(0,3);
        const noteHtml = notes.map((n,i)=>{
          const plus = (n.pluses||[]).map(x=>`<li>+ ${escapeHtml(x)}</li>`).join('');
          const minus = (n.minuses||[]).map(x=>`<li>− ${escapeHtml(x)}</li>`).join('');
          const when = n.createdAt ? new Date(n.createdAt).toLocaleString() : '';
          return `<div class="note">
            <h4>Entry ${i+1} • ${when}</h4>
            <div class="note-list">
              <ul style="margin:0; padding-left:18px">${plus}</ul>
              <ul style="margin:0; padding-left:18px">${minus}</ul>
            </div>
          </div>`;
        }).join('');
        return `<div class="item" style="flex-direction:column; align-items:stretch;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <div>
              <div style="font-weight:700; font-size:16px">${row.teammate}</div>
              <div class="muted" style="font-size:12px">${row.city} • Team ${row.team}</div>
            </div>
            <div class="row">${pills}</div>
          </div>
          <div class="details">${noteHtml || '<div class="muted">No notes yet.</div>'}</div>
        </div>`;
      }).join('') || '<div class="muted">No data yet.</div>';
    }

    function escapeHtml(s){
      const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
      return String(s ?? '').replace(/[&<>"']/g, ch => map[ch]);
    }
    // Export CSV of current filtered entries
    function toCSV(rows){
      const header = ['createdAt','city','team','teammate','emotion','evaluatorName','plus1','plus2','plus3','minus1','minus2','minus3'];
      const lines = [header.join(',')];
      for (const r of rows){
        const plus = (r.pluses||[]); const minus = (r.minuses||[]);
        const vals = [
          r.createdAt || '',
          r.city || '',
          r.team || '',
          r.teammate || '',
          r.emotion || '',
          r.evaluatorName || '',
          plus[0]||'', plus[1]||'', plus[2]||'',
          minus[0]||'', minus[1]||'', minus[2]||''
        ].map(v => '"' + String(v).replace(/"/g,'""') + '"');
        lines.push(vals.join(','));
      }
      return lines.join('\n');
    }

    // Hook up export button
    document.getElementById('exportBtn').addEventListener('click', () => {
      const city = document.getElementById('cityFilter').value;
      const team = document.getElementById('teamFilter').value;
      const windowDays = document.getElementById('timeFilter').value;
      const filtered = allEntries.filter(e =>
        (!city || e.city === city) &&
        (!team || e.team === team) &&
        withinWindow(e.createdAt || 0, windowDays)
      );
      const csv = toCSV(filtered);
      const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      a.download = `emotion-entries-${stamp}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
