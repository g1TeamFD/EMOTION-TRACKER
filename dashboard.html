<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback – Member Evaluations</title>
  <style>
    :root { --bg:#edf6ef; --card:#ffffff; --text:#0b1f14; --muted:#5a6b5f; --border:#cfe2d5; --primary:#14532d; --primary-ink:#ffffff; --accent:#1a7f46; --ring:#9ae6b4; }
    *{ box-sizing: border-box; }
    body{ margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:linear-gradient(160deg, #f0f7f2, #e7f2ea); color:var(--text); }
    .container{ max-width:1400px; margin:0 auto; padding:24px; }
    .nav{ position:sticky; top:0; z-index:10; backdrop-filter: blur(6px); background:rgba(255,255,255,0.6); border-bottom:1px solid var(--border); }
    .nav-inner{ max-width:1400px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    .brand{ font-weight:700; color:var(--primary); letter-spacing:0.2px; }
    .nav-link{ padding:8px 12px; border-radius:10px; text-decoration:none; color:var(--text); font-weight:600; }
    .nav-link:hover{ background:#e6f3ea; }
    .nav-link.active{ background:var(--primary); color:var(--primary-ink); }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow: 0 6px 20px rgba(20,83,45,0.06); margin-bottom:20px; }
    h1{ font-size:24px; margin:0 0 6px; }
    p.desc{ margin:0; color:var(--muted); font-size:14px; }
    label{ font-size:13px; font-weight:700; display:block; margin-bottom:6px; color:#0f2917; }
    input[type="text"]{ padding:10px 12px; border-radius:10px; border:1px solid var(--border); outline:none; background:#fbfefc; font-family: inherit; width:100%; }
    input[type="text"]:focus{ box-shadow: 0 0 0 3px rgba(46,125,75,0.18); border-color: var(--accent);}  
    .btn{ background:var(--primary); color:var(--primary-ink); padding:10px 16px; border:none; border-radius:12px; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,0.06); font-weight:600; font-size:14px; font-family: inherit;} 
    .btn:hover{ filter:brightness(1.05);} 
    .btn:active{ transform: translateY(1px);} 
    .btn-secondary{ background:var(--accent); }
    .search-bar{ display:flex; gap:12px; margin-bottom:20px; align-items:end; }
    .search-group{ flex:1; }
    .table-container{ overflow-x:auto; background:white; border-radius:12px; border:1px solid var(--border); }
    table{ width:100%; border-collapse: collapse; }
    th, td{ padding:14px 16px; text-align:left; border-bottom:1px solid var(--border); }
    th{ background:#f9fcfa; font-weight:700; font-size:13px; color:var(--primary); position:sticky; top:0; z-index:5; }
    td{ font-size:14px; }
    tr:last-child td{ border-bottom:none; }
    tbody tr:hover{ background:#f9fcfa; }
    .program-name{ font-weight:600; color:var(--primary); }
    .score-cell{ text-align:center; font-weight:600; color:var(--accent); }
    .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state h3{ margin:0 0 8px; color:var(--text); }
    .action-bar{ display:flex; gap:12px; justify-content:flex-end; margin-bottom:16px; flex-wrap:wrap; }
    @media (max-width: 768px){ 
      .search-bar{ flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand">🌿 Pulse</div>
      <div class="links">
        <a href="index.html" class="nav-link">Check‑in</a>
        <a href="dashboard.html" class="nav-link active">Feedback</a>
        <a href="dashboard-v2.html" class="nav-link">Scoreboard</a>
        <a href="teachers.html" class="nav-link">Teachers</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Member Evaluation Dashboard</h1>
      <p class="desc">View and search member evaluations with detailed feedback</p>
    </div>

    <!-- Search Box -->
    <div class="card">
      <div class="search-bar">
        <div class="search-group">
          <label>Search by Name</label>
          <input type="text" id="searchName" placeholder="Type member name to search..." />
        </div>
        <button class="btn" id="clearSearch">Clear</button>
      </div>
      <div class="action-bar">
        <button class="btn btn-secondary" id="exportBtn">📊 Export to CSV</button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="card">
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Program</th>
              <th>Subprogram</th>
              <th>Name</th>
              <th>Score</th>
              <th>Plus</th>
              <th>Minus</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7" class="empty-state">
                <h3>Loading data...</h3>
                <p>Please wait while we fetch evaluation data</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBog7q44JN9wVjfk2wy7FqS80NLJC5348g",
      authDomain: "emotion-tracker-7f11c.firebaseapp.com",
      databaseURL: "https://emotion-tracker-7f11c-default-rtdb.firebaseio.com",
      projectId: "emotion-tracker-7f11c",
      storageBucket: "emotion-tracker-7f11c.firebasestorage.app",
      messagingSenderId: "232586277659",
      appId: "1:232586277659:web:1fcff097243c8fa1ef99be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allEntries = [];
    let filteredEntries = [];

    // Load all entries from Firebase
    function loadEntries() {
      db.ref('entries').once('value', snapshot => {
        allEntries = [];
        snapshot.forEach(child => {
          const entry = child.val();
          entry.id = child.key;
          allEntries.push(entry);
        });
        
        console.log('Loaded entries:', allEntries.length);
        applySearch();
      });
    }

    // Apply search filter
    function applySearch() {
      const searchName = document.getElementById('searchName').value.toLowerCase();

      filteredEntries = [];
      
      allEntries.forEach(entry => {
        const memberEvals = entry.memberEvaluations || [];
        
        memberEvals.forEach(member => {
          if (!searchName || member.memberName?.toLowerCase().includes(searchName)) {
            filteredEntries.push({
              id: entry.id,
              createdAt: entry.createdAt,
              program: entry.program || 'N/A',
              subprogram: entry.subprogram || 'N/A',
              memberName: member.memberName,
              score: member.score,
              pluses: member.pluses || [],
              minuses: member.minuses || []
            });
          }
        });
      });

      renderTable();
    }

    // Render data table
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      
      if (filteredEntries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="empty-state">
              <h3>No evaluations found</h3>
              <p>Try adjusting your search or add new evaluations</p>
            </td>
          </tr>
        `;
        return;
      }

      // Sort by date (newest first)
      const sortedEntries = [...filteredEntries].sort((a, b) => {
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      let html = '';
      sortedEntries.forEach(entry => {
        const date = new Date(entry.createdAt).toLocaleDateString();
        const pluses = entry.pluses.join(', ');
        const minuses = entry.minuses.join(', ');
        
        html += `
          <tr>
            <td>${date}</td>
            <td class="program-name">${entry.program}</td>
            <td>${entry.subprogram}</td>
            <td><strong>${entry.memberName}</strong></td>
            <td class="score-cell">${entry.score}</td>
            <td>${pluses}</td>
            <td>${minuses}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // Export to CSV
    function exportToCSV() {
      if (filteredEntries.length === 0) {
        alert('No data to export');
        return;
      }

      // Sort by date (newest first) for export
      const sortedEntries = [...filteredEntries].sort((a, b) => {
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      let csv = 'Date,Program,Subprogram,Name,Score,Plus,Minus\n';

      sortedEntries.forEach(entry => {
        const date = new Date(entry.createdAt).toLocaleDateString();
        const pluses = entry.pluses.join('; ');
        const minuses = entry.minuses.join('; ');
        
        csv += `"${date}","${entry.program}","${entry.subprogram}","${entry.memberName}","${entry.score}","${pluses}","${minuses}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `member-evaluations-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    // Clear search
    function clearSearch() {
      document.getElementById('searchName').value = '';
      applySearch();
    }

    // Event listeners
    document.getElementById('searchName').addEventListener('keyup', applySearch);
    document.getElementById('clearSearch').addEventListener('click', clearSearch);
    document.getElementById('exportBtn').addEventListener('click', exportToCSV);

    // Load data on page load
    loadEntries();
  </script>
</body>
</html>
