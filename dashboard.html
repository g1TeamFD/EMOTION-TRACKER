<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FD 360 – Feedback Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ── */
    :root {
      --sand:         #faf8f4;
      --sand2:        #f2ede4;
      --sand3:        #e6dfd4;
      --white:        #ffffff;
      --ink:          #28211c;
      --ink2:         #6b5f56;
      --ink3:         #a8998e;
      --teal:         #2a7a6c;
      --teal-light:   #e6f4f1;
      --teal-mid:     #3d9e8d;
      --rose:         #b84e48;
      --rose-light:   #fdf0ef;
      --amber:        #b07030;
      --amber-light:  #fdf4e7;
      --border:       rgba(40,33,28,0.1);
      --border-md:    rgba(40,33,28,0.18);
      --border-str:   rgba(40,33,28,0.26);
      --card-bg:      #ffffff;
      --page-bg:      #faf8f4;
      --input-bg:     #f5f1eb;
      --shadow:       0 1px 4px rgba(40,33,28,0.06), 0 4px 16px rgba(40,33,28,0.04);
    }

    [data-theme="dark"] {
      --sand:         #1a1612;
      --sand2:        #231e19;
      --sand3:        #2e2720;
      --white:        #2e2720;
      --ink:          #f0ebe4;
      --ink2:         #b0a090;
      --ink3:         #6e6058;
      --teal:         #4db8a6;
      --teal-light:   #0f2e2a;
      --teal-mid:     #3d9e8d;
      --rose:         #e07068;
      --rose-light:   #2e1614;
      --amber:        #d4944a;
      --amber-light:  #2a1e0c;
      --border:       rgba(240,235,228,0.08);
      --border-md:    rgba(240,235,228,0.14);
      --border-str:   rgba(240,235,228,0.22);
      --card-bg:      #231e19;
      --page-bg:      #1a1612;
      --input-bg:     #2e2720;
      --shadow:       0 1px 4px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--page-bg); color: var(--ink);
      min-height: 100vh; line-height: 1.5;
      transition: background 0.25s, color 0.25s;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
      height: 60px; transition: background 0.25s, border-color 0.25s;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .globe-svg { width: 30px; height: 30px; flex-shrink: 0; }
    .brand-text { display: flex; flex-direction: column; line-height: 1; }
    .brand-name { font-family: 'DM Serif Display', Georgia, serif; font-size: 16px; color: var(--ink); letter-spacing: -0.2px; }
    .brand-sub { font-size: 9px; color: var(--ink3); letter-spacing: 1.8px; text-transform: uppercase; font-weight: 400; margin-top: 3px; }
    
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-links { display: flex; gap: 2px; align-items: center; }
    .nav-link { font-size: 13px; font-weight: 400; padding: 6px 14px; border-radius: 100px; text-decoration: none; color: var(--ink2); transition: background 0.15s, color 0.15s; cursor: pointer; border: 1px solid transparent; }
    .nav-link:hover { background: var(--sand2); color: var(--ink); }
    .nav-link.active { background: var(--ink); color: var(--page-bg); }

    .theme-toggle {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-md); background: var(--input-bg);
      cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink2); transition: all 0.15s; flex-shrink: 0;
    }
    .theme-toggle:hover { background: var(--sand3); color: var(--ink); }
    .theme-toggle svg { width: 15px; height: 15px; }
    .icon-sun { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    .mobile-menu-btn {
      display: none; background: transparent; border: none; padding: 4px;
      color: var(--ink); cursor: pointer; transition: opacity 0.2s;
    }
    .mobile-menu-btn svg { width: 24px; height: 24px; }

    /* ── LAYOUT ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom: 32px; }
    .page-eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); font-weight: 500; margin-bottom: 14px; }
    .eyebrow-line { width: 22px; height: 1px; background: var(--teal); }
    .page-title { font-family: 'DM Serif Display', Georgia, serif; font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -1px; color: var(--ink); margin-bottom: 14px;}
    .page-desc { font-size: 15px; color: var(--ink2); line-height: 1.75; max-width: 600px; font-weight: 300; margin-bottom: 0;}

    /* ── CARDS & FIELDS ── */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 28px 32px; margin-bottom: 14px; box-shadow: var(--shadow); transition: background 0.25s, border-color 0.25s, box-shadow 0.25s; }
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 7px; letter-spacing: 0.1px; }
    
    input[type="text"] { width: 100%; padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; outline: none; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; color: var(--ink); transition: border-color 0.18s, background 0.18s, box-shadow 0.18s; appearance: none; }
    input[type="text"]:hover { border-color: var(--border-md); }
    input[type="text"]:focus { border-color: var(--teal-mid); background: var(--card-bg); box-shadow: 0 0 0 3px rgba(61,158,141,0.12); }
    input::placeholder { color: var(--ink3); font-weight: 300; }

    /* ── BUTTONS ── */
    .btn { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.1px; padding: 11px 22px; border-radius: 100px; border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-outline { background: transparent; color: var(--ink2); border: 1px solid var(--border-md); }
    .btn-outline:hover { background: var(--sand2); color: var(--ink); }
    .btn-teal { background: var(--teal-light); color: var(--teal); border: 1px solid rgba(61,158,141,0.25); }
    .btn-teal:hover { filter: brightness(0.96); }

    /* ── SEARCH ACTIONS ── */
    .add-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .add-row .field { flex: 1; min-width: 200px; margin-bottom: 0; }

    /* ── TABLE ── */
    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink3); padding: 14px 16px; border-bottom: 1px solid var(--border-md); font-weight: 500; white-space: nowrap;}
    td { padding: 18px 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--ink); vertical-align: top; line-height: 1.6;}
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--sand); }
    
    .program-name { font-weight: 500; color: var(--teal); }
    .member-name { font-family: 'DM Serif Display', Georgia, serif; font-size: 17px; }
    .score-cell { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--amber); text-align: center; }
    .date-cell { color: var(--ink3); font-size: 13px; white-space: nowrap;}
    
    .feedback-list { margin: 0; padding-left: 18px; color: var(--ink2); font-weight: 300;}
    .feedback-list li { margin-bottom: 4px; }
    .feedback-list li:last-child { margin-bottom: 0; }

    .empty-state { text-align: center; padding: 48px 24px; border: 1.5px dashed var(--border-md); border-radius: 14px; color: var(--ink3); font-size: 14px; font-weight: 300; line-height: 1.7; margin-top: 20px;}
    .empty-icon { width: 38px; height: 38px; margin: 0 auto 12px; border-radius: 50%; background: var(--sand3); display: flex; align-items: center; justify-content: center; color: var(--ink2);}

    .hidden { display: none !important; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .mobile-menu-btn { display: block; }
      .nav-links {
        display: none; position: absolute; top: 60px; left: 0; right: 0;
        background: var(--card-bg); flex-direction: column; align-items: flex-start;
        padding: 16px; border-bottom: 1px solid var(--border);
        box-shadow: 0 10px 20px rgba(0,0,0,0.06); z-index: 90;
      }
      .nav-links.show { display: flex; }
      .nav-link { width: 100%; padding: 12px 14px; text-align: left; border-radius: 8px; }

      .container { padding: 32px 16px 60px; }
      .card { padding: 20px; }
      .add-row { flex-direction: column; align-items: stretch; }
      .add-row .btn { align-self: auto !important; margin-bottom: 0 !important; margin-top: 8px;}
    }
  </style>
</head>
<body>

  <nav>
    <a class="brand" href="#">
      <svg class="globe-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="12.5" stroke="var(--teal)" stroke-width="1.3"/>
        <ellipse cx="16" cy="16" rx="5.5" ry="12.5" stroke="var(--teal)" stroke-width="1.3"/>
        <path d="M3.5 16 Q9 13.5 16 14.5 Q23 15.5 28.5 16" stroke="var(--teal)" stroke-width="1.1" fill="none"/>
        <path d="M5.5 10 Q10.5 8.5 16 9 Q21.5 9.5 26.5 10" stroke="var(--teal)" stroke-width="0.9" fill="none" stroke-dasharray="0"/>
        <path d="M5.5 22 Q10.5 23.5 16 23 Q21.5 22.5 26.5 22" stroke="var(--teal)" stroke-width="0.9" fill="none"/>
        <circle cx="16" cy="16" r="1.8" fill="var(--teal)"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">FD 360</span>
        <span class="brand-sub">peer review</span>
      </div>
    </a>

    <div class="nav-right">
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">check-in</a>
        <a href="dashboard.html" class="nav-link active">feedback</a>
        <a href="dashboard-v2.html" class="nav-link">dashboard</a>
        <a href="teachers.html" class="nav-link">teachers</a>
      </div>
      
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12.5 10A6 6 0 015 2.5a6.5 6.5 0 100 10 6 6 0 007.5-2.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="3"/><path d="M7.5 1v1.5M7.5 12.5V14M14 7.5h-1.5M2.5 7.5H1M12 3l-1 1M4 11l-1 1M12 12l-1-1M4 4l-1-1"/></svg>
      </button>

      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h18M3 6h18M3 18h18" />
        </svg>
      </button>
    </div>
  </nav>

  <main class="container">
    
    <div class="page-header">
      <div class="page-eyebrow"><span class="eyebrow-line"></span> Results</div>
      <h1 class="page-title">Member Feedback</h1>
      <p class="page-desc">View, search, and export compiled evaluations from your program.</p>
    </div>

    <div class="card">
      <div class="add-row">
        <div class="field">
          <label class="field-label" for="searchName">Search Directory</label>
          <input type="text" id="searchName" placeholder="Type member name to filter..." />
        </div>
        <button class="btn btn-outline" id="clearSearch">
          Clear
        </button>
        <button class="btn btn-teal" id="exportBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v8M4 6l3 3 3-3M2 12h10"/></svg>
          Export CSV
        </button>
      </div>
    </div>

    <div class="card" style="padding: 16px 24px;">
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Program Details</th>
              <th>Name</th>
              <th style="text-align: center;">Score</th>
              <th>Strengths</th>
              <th>Growth Edges</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" style="border: none;">
                <div class="empty-state">
                  <div class="empty-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  </div>
                  Loading directory data...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

  <script>
    /* ── THEME & NAV LOGIC ── */
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('fd360_theme');
    if (savedTheme) html.setAttribute('data-theme', savedTheme);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) html.setAttribute('data-theme', 'dark');

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('fd360_theme', next);
    });

    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    mobileMenuBtn.addEventListener('click', () => navLinks.classList.toggle('show'));
    document.addEventListener('click', (e) => {
      if (!navLinks.contains(e.target) && !mobileMenuBtn.contains(e.target)) navLinks.classList.remove('show');
    });

    /* ── FIREBASE DB LOGIC ── */
    const firebaseConfig = {
      apiKey: "AIzaSyBog7q44JN9wVjfk2wy7FqS80NLJC5348g",
      authDomain: "emotion-tracker-7f11c.firebaseapp.com",
      databaseURL: "https://emotion-tracker-7f11c-default-rtdb.firebaseio.com",
      projectId: "emotion-tracker-7f11c",
      storageBucket: "emotion-tracker-7f11c.firebasestorage.app",
      messagingSenderId: "232586277659",
      appId: "1:232586277659:web:1fcff097243c8fa1ef99be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allEntries = [];
    let filteredEntries = [];

    // Load all entries
    function loadEntries() {
      db.ref('entries').once('value', snapshot => {
        allEntries = [];
        snapshot.forEach(child => {
          const entry = child.val();
          entry.id = child.key;
          allEntries.push(entry);
        });
        applySearch();
      });
    }

    // Convert an array of text (from textarea lines) to <ul> for aesthetic reading
    function arrayToList(arr) {
      if (!arr || arr.length === 0) return `<span style="color: var(--ink3); font-style: italic;">—</span>`;
      return `<ul class="feedback-list">` + arr.map(item => `<li>${item}</li>`).join('') + `</ul>`;
    }

    // Apply Search Filter
    function applySearch() {
      const searchName = document.getElementById('searchName').value.toLowerCase();
      filteredEntries = [];
      
      allEntries.forEach(entry => {
        const memberEvals = entry.memberEvaluations || [];
        memberEvals.forEach(member => {
          if (!searchName || member.memberName?.toLowerCase().includes(searchName)) {
            filteredEntries.push({
              id: entry.id,
              createdAt: entry.createdAt,
              program: entry.program || 'N/A',
              subprogram: entry.subprogram && entry.subprogram !== 'N/A' ? entry.subprogram : '',
              team: entry.team && entry.team !== 'N/A' ? entry.team : '',
              memberName: member.memberName,
              score: member.score || '—',
              pluses: member.pluses || [],
              minuses: member.minuses || []
            });
          }
        });
      });
      renderTable();
    }

    // Render Table HTML
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      
      if (filteredEntries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="border: none;">
              <div class="empty-state">
                <div class="empty-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                No evaluations found matching that name.
              </div>
            </td>
          </tr>`;
        return;
      }

      // Sort Newest First
      const sortedEntries = [...filteredEntries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      let html = '';
      sortedEntries.forEach(entry => {
        const date = new Date(entry.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        
        let details = `<span class="program-name">${entry.program}</span>`;
        if (entry.team) details += `<br><span style="font-size: 12px; color: var(--ink3);">Team: ${entry.team}</span>`;
        if (entry.subprogram) details += `<br><span style="font-size: 12px; color: var(--ink3);">${entry.subprogram}</span>`;

        html += `
          <tr>
            <td class="date-cell">${date}</td>
            <td>${details}</td>
            <td class="member-name">${entry.memberName}</td>
            <td class="score-cell">${entry.score}</td>
            <td>${arrayToList(entry.pluses)}</td>
            <td>${arrayToList(entry.minuses)}</td>
          </tr>`;
      });

      tbody.innerHTML = html;
    }

    // Export CSV logic
    function exportToCSV() {
      if (filteredEntries.length === 0) { alert('No data to export'); return; }

      const sortedEntries = [...filteredEntries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      let csv = 'Date,Program,Team,Subprogram,Name,Score,Strengths,Growth Edges\n';

      sortedEntries.forEach(entry => {
        const date = new Date(entry.createdAt).toLocaleDateString();
        const pluses = entry.pluses.join('; ').replace(/"/g, '""');
        const minuses = entry.minuses.join('; ').replace(/"/g, '""');
        
        csv += `"${date}","${entry.program}","${entry.team}","${entry.subprogram}","${entry.memberName}","${entry.score}","${pluses}","${minuses}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `FD360-Evaluations-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    // Event Listeners
    document.getElementById('searchName').addEventListener('input', applySearch);
    document.getElementById('clearSearch').addEventListener('click', () => {
      document.getElementById('searchName').value = '';
      applySearch();
    });
    document.getElementById('exportBtn').addEventListener('click', exportToCSV);

    // Init
    loadEntries();
  </script>
</body>
</html>
