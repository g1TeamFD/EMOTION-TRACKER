<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard v2 – Team Evaluations</title>
  <style>
    :root { --bg:#edf6ef; --card:#ffffff; --text:#0b1f14; --muted:#5a6b5f; --border:#cfe2d5; --primary:#14532d; --primary-ink:#ffffff; --accent:#1a7f46; --ring:#9ae6b4; }
    *{ box-sizing: border-box; }
    body{ margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:linear-gradient(160deg, #f0f7f2, #e7f2ea); color:var(--text); }
    .container{ max-width:1400px; margin:0 auto; padding:24px; }
    .nav{ position:sticky; top:0; z-index:10; backdrop-filter: blur(6px); background:rgba(255,255,255,0.6); border-bottom:1px solid var(--border); }
    .nav-inner{ max-width:1400px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    .brand{ font-weight:700; color:var(--primary); letter-spacing:0.2px; }
    .nav-link{ padding:8px 12px; border-radius:10px; text-decoration:none; color:var(--text); font-weight:600; }
    .nav-link:hover{ background:#e6f3ea; }
    .nav-link.active{ background:var(--primary); color:var(--primary-ink); }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow: 0 6px 20px rgba(20,83,45,0.06); margin-bottom:20px; }
    h1{ font-size:24px; margin:0 0 6px; }
    p.desc{ margin:0; color:var(--muted); font-size:14px; }
    label{ font-size:13px; font-weight:700; display:block; margin-bottom:6px; color:#0f2917; }
    select{ padding:10px 12px; border-radius:10px; border:1px solid var(--border); outline:none; background:#fbfefc; font-family: inherit; min-width:200px; }
    select:focus{ box-shadow: 0 0 0 3px rgba(46,125,75,0.18); border-color: var(--accent);}  
    .btn{ background:var(--primary); color:var(--primary-ink); padding:10px 16px; border:none; border-radius:12px; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,0.06); font-weight:600; font-size:14px; font-family: inherit;} 
    .btn:hover{ filter:brightness(1.05);} 
    .btn:active{ transform: translateY(1px);} 
    .btn-secondary{ background:var(--accent); }
    .filters{ display:flex; gap:16px; margin-bottom:20px; align-items:end; flex-wrap:wrap; }
    .filter-group{ display:flex; flex-direction:column; }
    .table-container{ overflow-x:auto; background:white; border-radius:12px; border:1px solid var(--border); }
    table{ width:100%; border-collapse: collapse; }
    th, td{ padding:14px 16px; text-align:left; border-bottom:1px solid var(--border); }
    th{ background:#f9fcfa; font-weight:700; font-size:13px; color:var(--primary); position:sticky; top:0; z-index:5; white-space:nowrap; }
    td{ font-size:14px; }
    tr:last-child td{ border-bottom:none; }
    tbody tr:hover{ background:#f9fcfa; }
    .team-name{ font-weight:700; color:var(--primary); font-size:16px; }
    .score-cell{ text-align:center; font-weight:700; color:var(--accent); font-size:18px; }
    .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state h3{ margin:0 0 8px; color:var(--text); }
    .action-bar{ display:flex; gap:12px; justify-content:flex-end; margin-bottom:16px; }
    .team-separator{ background:#e8f5ec !important; }
    @media (max-width: 768px){ 
      .filters{ flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand">🌿 Pulse</div>
      <div class="links">
        <a href="index.html" class="nav-link">Check‑in</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="dashboard-v2.html" class="nav-link active">Dashboard v2</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Team Evaluation Dashboard</h1>
      <p class="desc">View team member scores sorted by team and performance</p>
    </div>

    <!-- Filters -->
    <div class="card">
      <div class="filters">
        <div class="filter-group">
          <label>Event (Filter)</label>
          <select id="filterEvent">
            <option value="">All Events</option>
          </select>
        </div>
        <div class="filter-group">
          <label>City</label>
          <select id="filterCity">
            <option value="">All Cities</option>
          </select>
        </div>
        <button class="btn" id="applyFilters" style="align-self:flex-end;">Apply Filters</button>
        <button class="btn btn-secondary" id="resetFilters" style="align-self:flex-end;">Reset</button>
      </div>
      <div class="action-bar">
        <button class="btn btn-secondary" id="exportBtn">📊 Export to CSV</button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="card">
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Event</th>
              <th>City</th>
              <th>Team</th>
              <th>Name</th>
              <th>Average Score</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" class="empty-state">
                <h3>Loading data...</h3>
                <p>Please wait while we fetch evaluation data</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBog7q44JN9wVjfk2wy7FqS80NLJC5348g",
      authDomain: "emotion-tracker-7f11c.firebaseapp.com",
      databaseURL: "https://emotion-tracker-7f11c-default-rtdb.firebaseio.com",
      projectId: "emotion-tracker-7f11c",
      storageBucket: "emotion-tracker-7f11c.firebasestorage.app",
      messagingSenderId: "232586277659",
      appId: "1:232586277659:web:1fcff097243c8fa1ef99be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allEntries = [];
    let filteredEntries = [];

    // Load all entries from Firebase
    function loadEntries() {
      db.ref('entries').once('value', snapshot => {
        allEntries = [];
        snapshot.forEach(child => {
          const entry = child.val();
          entry.id = child.key;
          allEntries.push(entry);
        });
        
        populateFilters();
        applyFilters();
      });
    }

    // Populate filter dropdowns
    function populateFilters() {
      const events = new Set();
      const cities = new Set();

      allEntries.forEach(entry => {
        if (entry.event) events.add(entry.event);
        if (entry.city) cities.add(entry.city);
      });

      const eventSelect = document.getElementById('filterEvent');
      const citySelect = document.getElementById('filterCity');

      eventSelect.innerHTML = '<option value="">All Events</option>' +
        Array.from(events).sort().map(e => `<option value="${e}">${formatEventName(e)}</option>`).join('');

      citySelect.innerHTML = '<option value="">All Cities</option>' +
        Array.from(cities).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // Format event name
    function formatEventName(eventId) {
      const names = {
        'sustainability_bootcamp': 'Sustainability Bootcamp',
        'story_a_night': 'Story a Night',
        'young_ambassadors_training': 'Young Ambassadors Training'
      };
      return names[eventId] || eventId;
    }

    // Apply filters and render table
    function applyFilters() {
      const filterEvent = document.getElementById('filterEvent').value;
      const filterCity = document.getElementById('filterCity').value;

      filteredEntries = allEntries.filter(entry => {
        if (filterEvent && entry.event !== filterEvent) return false;
        if (filterCity && entry.city !== filterCity) return false;
        return true;
      });

      renderTable();
    }

    // Extract team number for sorting
    function getTeamNumber(teamName) {
      if (!teamName) return 999; // Put entries without team at the end
      const match = teamName.match(/\d+/);
      return match ? parseInt(match[0]) : 999;
    }

    // Calculate average score for a member across all their evaluations
    function calculateMemberAverageScore(memberName, team) {
      const memberScores = [];
      
      filteredEntries.forEach(entry => {
        if (entry.team === team) {
          const memberEvals = entry.memberEvaluations || [];
          memberEvals.forEach(member => {
            if (member.memberName === memberName && member.score) {
              memberScores.push(member.score);
            }
          });
        }
      });
      
      if (memberScores.length === 0) return 0;
      const sum = memberScores.reduce((acc, score) => acc + score, 0);
      return (sum / memberScores.length).toFixed(1);
    }

    // Render data table
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      
      if (filteredEntries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <h3>No evaluations found</h3>
              <p>Try adjusting your filters or add new evaluations</p>
            </td>
          </tr>
        `;
        return;
      }

      // Create a map of unique members per team
      const teamMembers = new Map();
      
      filteredEntries.forEach(entry => {
        const memberEvals = entry.memberEvaluations || [];
        memberEvals.forEach(member => {
          const key = `${entry.team}|${member.memberName}`;
          if (!teamMembers.has(key)) {
            teamMembers.set(key, {
              team: entry.team,
              memberName: member.memberName,
              date: entry.createdAt,
              event: entry.event,
              city: entry.city
            });
          }
        });
      });

      // Convert to array and calculate average scores
      const membersList = Array.from(teamMembers.values()).map(member => ({
        ...member,
        avgScore: parseFloat(calculateMemberAverageScore(member.memberName, member.team))
      }));

      // Sort by team number first, then by score (highest to lowest)
      membersList.sort((a, b) => {
        const teamA = getTeamNumber(a.team);
        const teamB = getTeamNumber(b.team);
        
        if (teamA !== teamB) {
          return teamA - teamB; // Sort by team number ascending
        }
        
        return b.avgScore - a.avgScore; // Sort by score descending within same team
      });

      // Render table rows
      let html = '';
      let lastTeam = null;
      
      membersList.forEach(member => {
        const date = new Date(member.date).toLocaleDateString();
        
        // Add visual separator between teams
        const rowClass = member.team !== lastTeam ? 'team-separator' : '';
        lastTeam = member.team;
        
        html += `
          <tr class="${rowClass}">
            <td>${date}</td>
            <td>${formatEventName(member.event)}</td>
            <td>${member.city || 'N/A'}</td>
            <td class="team-name">${member.team || 'N/A'}</td>
            <td><strong>${member.memberName}</strong></td>
            <td class="score-cell">${member.avgScore}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // Export to CSV
    function exportToCSV() {
      if (filteredEntries.length === 0) {
        alert('No data to export');
        return;
      }

      let csv = 'Date,Event,City,Team,Name,Average Score\n';

      // Recreate the same sorting logic for export
      const teamMembers = new Map();
      
      filteredEntries.forEach(entry => {
        const memberEvals = entry.memberEvaluations || [];
        memberEvals.forEach(member => {
          const key = `${entry.team}|${member.memberName}`;
          if (!teamMembers.has(key)) {
            teamMembers.set(key, {
              team: entry.team,
              memberName: member.memberName,
              date: entry.createdAt,
              event: entry.event,
              city: entry.city
            });
          }
        });
      });

      const membersList = Array.from(teamMembers.values()).map(member => ({
        ...member,
        avgScore: parseFloat(calculateMemberAverageScore(member.memberName, member.team))
      }));

      membersList.sort((a, b) => {
        const teamA = getTeamNumber(a.team);
        const teamB = getTeamNumber(b.team);
        if (teamA !== teamB) return teamA - teamB;
        return b.avgScore - a.avgScore;
      });

      membersList.forEach(member => {
        const date = new Date(member.date).toLocaleDateString();
        csv += `"${date}","${formatEventName(member.event)}","${member.city || 'N/A'}","${member.team || 'N/A'}","${member.memberName}","${member.avgScore}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `team-evaluations-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    // Reset filters
    function resetFilters() {
      document.getElementById('filterEvent').value = '';
      document.getElementById('filterCity').value = '';
      applyFilters();
    }

    // Event listeners
    document.getElementById('applyFilters').addEventListener('click', applyFilters);
    document.getElementById('resetFilters').addEventListener('click', resetFilters);
    document.getElementById('exportBtn').addEventListener('click', exportToCSV);

    // Load data on page load
    loadEntries();
  </script>
</body>
</html>
